server {
    listen 80;
    
    # Thay bằng domain thực tế của bạn hoặc dùng '_'
    server_name domain.com www.domain.com; 

    # 1. Định tuyến cho Backend API Gateway
    location /api/ {
        # Chuyển hướng các request bắt đầu bằng /api/ tới port 8080
        proxy_pass http://localhost:8080;

        # Giữ nguyên và truyền các Header quan trọng xuống Backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Định tuyến cho Frontend React (Các request còn lại)
    location / {
        # Chuyển hướng tới ứng dụng React ở port 3000
        proxy_pass http://localhost:3000;

        # Giữ nguyên và truyền các Header quan trọng
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # (Tùy chọn) Cần thiết cho React/WebSocket nếu dùng Hot Reload
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}